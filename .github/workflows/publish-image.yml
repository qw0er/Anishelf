name: Publish container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check out release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Release tag must match package.json");'

      - name: Validate release notes
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Check publication source
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing test images from $GITHUB_REF."
            exit 0
          fi
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release image publication: the tagged commit is not in main."
          fi

  verify:
    needs: check-source
    if: needs.check-source.outputs.allowed == 'true'
    uses: ./.github/workflows/check.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        component: [backend, web]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/qw0er/anishelf-${{ matrix.component }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=raw,value=testing,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=test-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: package/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=ghcr.io/qw0er/anishelf-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ANISHELF_BUILD_TAG=${{ github.event_name == 'push' && github.ref_name || '' }}
            ANISHELF_BUILD_COMMIT=${{ github.sha }}
            ANISHELF_BUILD_CHANNEL=${{ github.event_name == 'workflow_dispatch' && 'testing' || 'stable' }}
          cache-from: type=gha,scope=image-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.component }}-${{ matrix.architecture }},mode=max

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    strategy:
      matrix:
        component: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/qw0er/anishelf-${{ matrix.component }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=raw,value=testing,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=test-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/qw0er/anishelf-${{ matrix.component }}
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}" "${images[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          {
            echo "### Published $IMAGE"
            echo
            echo 'Platforms: linux/amd64 and linux/arm64'
            echo
            for tag in "${tags[@]}"; do
              printf -- '- `%s`\n' "$tag"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release after both image manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists."
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
