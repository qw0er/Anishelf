<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1320" viewBox="0 0 1460 1320" role="img" aria-labelledby="title desc">
<title id="title">Anishelf module ownership and boundaries</title>
<desc id="desc">Thirteen modules organized into five capability groups. Business collaboration uses Public APIs. Restricted persistence entries connect database adapters. App assembles modules and owns lifecycle; platform does not import business modules.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="1460" height="1320" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172a43">
<text x="40" y="48" font-size="30" font-weight="600">Anishelf · Ownership and dependency boundaries</text>
<text x="40" y="80" font-size="18">One backend process · Explicit module interfaces · Read-only original media</text>
<rect x="300" y="110" width="1120" height="120" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="325" y="148" font-size="24" font-weight="600">React Web</text>
<text x="325" y="181" font-size="18">app: routing and composition  →  features: public entries, requests, queries, controllers</text>
<text x="325" y="212" font-size="17">shared: HTTP / query mechanisms, UI, translations · No imports from features or app</text>
<path d="M860 230 V290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="267" font-size="16">HTTP / media / subtitles</text>
<rect x="300" y="290" width="1120" height="110" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="325" y="328" font-size="24" font-weight="600">HTTP boundary</text>
<text x="325" y="361" font-size="17">Module handlers → owning Applications · Module presenters · Shared transport mechanisms</text>
<rect x="40" y="290" width="220" height="770" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="60" y="332" font-size="23" font-weight="600">App assembly</text>
<text x="60" y="378" font-size="16">Startup / shutdown</text>
<text x="60" y="416" font-size="16">Dependency injection</text>
<text x="60" y="454" font-size="16">Module constructors</text>
<text x="60" y="492" font-size="16">Degraded startup</text>
<text x="60" y="530" font-size="16">Automatic recognition</text>
<text x="60" y="568" font-size="16">Schema aggregation</text>
<text x="60" y="695" font-size="15">Imports implementations</text>
<text x="60" y="726" font-size="15">for assembly only.</text>
<text x="60" y="790" font-size="16" font-weight="600">Modules cannot</text>
<text x="60" y="819" font-size="16" font-weight="600">import app.</text>
<path d="M260 585 H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M260 1000 H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M860 400 V450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="435" font-size="16">Business workflows</text>
<rect x="300" y="450" width="1120" height="465" rx="12" fill="#f0f7f4" stroke="#cbd5e1"/>
<text x="325" y="488" font-size="24" font-weight="600">Business modules</text>
<text x="325" y="518" font-size="17">Groups organize files; every module keeps its own Public API and ownership.</text>
<rect x="325" y="545" width="340" height="130" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="343" y="575" font-size="21" font-weight="600">system</text>
<text x="343" y="613" font-size="18">Configuration</text>
<rect x="690" y="545" width="340" height="130" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="708" y="575" font-size="21" font-weight="600">resources</text>
<text x="708" y="613" font-size="18">Library</text>
<text x="708" y="642" font-size="18">Resource Access</text>
<rect x="1055" y="545" width="340" height="130" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="1073" y="575" font-size="21" font-weight="600">playback</text>
<text x="1073" y="613" font-size="18">Playback</text>
<text x="1073" y="642" font-size="18">Playback Selection</text>
<rect x="325" y="695" width="705" height="145" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="343" y="726" font-size="21" font-weight="600">media</text>
<text x="343" y="759" font-size="17">Media Inspection · Media Planning · Media Processing</text>
<text x="343" y="787" font-size="17">Preparation · Subtitles</text>
<text x="343" y="815" font-size="17">Separate planning, execution and durable asset lifetimes</text>
<rect x="1055" y="695" width="340" height="145" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="1073" y="726" font-size="21" font-weight="600">anime</text>
<text x="1073" y="759" font-size="18">Identification</text>
<text x="1073" y="787" font-size="18">Metadata</text>
<text x="1073" y="815" font-size="18">Anime Catalog</text>
<text x="325" y="873" font-size="17">public.ts: business calls and types · policy.ts: policy definitions</text>
<text x="325" y="900" font-size="17">persistence.ts: table access only for database adapters and app assembly</text>
<path d="M860 915 V970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="949" font-size="16">Injected mechanism capabilities</text>
<rect x="300" y="970" width="1120" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="325" y="1008" font-size="24" font-weight="600">Platform</text>
<text x="325" y="1042" font-size="17">Database connection · Media tools / encoder contracts / process events · Logging · Runtime</text>
<path d="M860 1080 V1135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="1135" width="1120" height="90" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="325" y="1171" font-size="22" font-weight="600">External mechanisms</text>
<text x="325" y="1200" font-size="17">SQLite · Filesystem · FFprobe / FFmpeg · AniList via the Metadata adapter</text>
<text x="40" y="1262" font-size="17">Contracts: public protocol shapes · Shared: small internal concepts and tools</text>
<text x="40" y="1292" font-size="16">Solid arrows: layer use · Dashed arrows: assembly · Detailed module collaboration is documented in architecture.md</text>
</g>
</svg>
