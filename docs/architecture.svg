<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1570" viewBox="0 0 1460 1570" role="img" aria-labelledby="title desc">
<title id="title">Anishelf overall architecture</title>
<desc id="desc">React communicates with HTTP transport in one Node.js backend. Ten independent business modules use shared platform mechanisms. Bootstrap assembles dependencies and manages lifecycle. Playback selection is read-only; preparation is explicit; original media remains read-only. Only implemented modules are shown. Arrows show layer calls or dependency injection, not a complete module dependency graph.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="1460" height="1570" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172a43">
<text x="40" y="48" font-size="30" fill="#172a43" font-weight="600">Anishelf · Overall architecture</text>
<text x="40" y="80" font-size="18" fill="#475569">Existing runtime owners · Explicit preparation · Read-only originals</text>
<rect x="300" y="110" width="1120" height="95" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="325" y="145" font-size="23" fill="#172a43" font-weight="600">React Web application</text>
<text x="325" y="179" font-size="18" fill="#475569">Routes + feature Public APIs · Shared server queries · Browser media and interaction state</text>
<path d="M860 205 V260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="882" y="238" font-size="17" fill="#475569">HTTP · JSON / media / subtitle assets</text>
<rect x="280" y="260" width="1160" height="1020" rx="12" fill="#fafbfc" stroke="#cbd5e1"/>
<text x="300" y="290" font-size="15" fill="#64748b" font-weight="600">ONE NODE.JS BACKEND PROCESS</text>
<rect x="300" y="310" width="1120" height="95" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="325" y="345" font-size="23" fill="#172a43" font-weight="600">HTTP transport</text>
<text x="325" y="379" font-size="17" fill="#475569">Request validation · Module handlers → Applications · Response / error projection · Media streaming</text>
<path d="M860 405 V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="882" y="437" font-size="17" fill="#475569">calls module Applications</text>
<rect x="300" y="460" width="1120" height="615" rx="12" fill="#f0f7f4" stroke="#cbd5e1"/>
<text x="325" y="495" font-size="23" fill="#172a43" font-weight="600">Business modules</text>
<text x="325" y="523" font-size="17" fill="#475569">Independent owners; collaboration uses Public APIs and consumer-owned ports.</text>
<rect x="325" y="550" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="343" y="582" font-size="21" fill="#172a43" font-weight="600">Configuration</text>
<text x="343" y="615" font-size="17" fill="#475569">Validated policy + settings</text>
<text x="343" y="641" font-size="17" fill="#475569">Transcode profiles</text>
<rect x="690" y="550" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="708" y="582" font-size="21" fill="#172a43" font-weight="600">Library</text>
<text x="708" y="615" font-size="17" fill="#475569">Published resource index</text>
<text x="708" y="641" font-size="17" fill="#475569">Scans + root switching</text>
<rect x="1055" y="550" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1073" y="582" font-size="21" fill="#172a43" font-weight="600">Playback</text>
<text x="1073" y="615" font-size="17" fill="#475569">Progress sessions</text>
<text x="1073" y="641" font-size="17" fill="#475569">Durable progress + history</text>
<rect x="325" y="700" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="343" y="732" font-size="21" fill="#172a43" font-weight="600">Playback Selection</text>
<text x="343" y="765" font-size="17" fill="#475569">Browser evidence + candidates</text>
<text x="343" y="791" font-size="17" fill="#475569">Read-only resource choice</text>
<rect x="690" y="700" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="708" y="732" font-size="21" fill="#172a43" font-weight="600">Preparation</text>
<text x="708" y="765" font-size="17" fill="#475569">Explicit tasks + scheduling</text>
<text x="708" y="791" font-size="17" fill="#475569">Reusable prepared artifacts</text>
<rect x="1055" y="700" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1073" y="732" font-size="21" fill="#172a43" font-weight="600">Subtitles</text>
<text x="1073" y="765" font-size="17" fill="#475569">Track discovery + preparation</text>
<text x="1073" y="791" font-size="17" fill="#475569">Text / font assets + delivery</text>
<rect x="325" y="850" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="343" y="882" font-size="21" fill="#172a43" font-weight="600">Media Planning</text>
<text x="343" y="915" font-size="17" fill="#475569">Compatibility decisions</text>
<text x="343" y="941" font-size="17" fill="#475569">Expected output specifications</text>
<rect x="690" y="850" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="708" y="882" font-size="21" fill="#172a43" font-weight="600">Media Inspection</text>
<text x="708" y="915" font-size="17" fill="#475569">Source-bound metadata</text>
<text x="708" y="941" font-size="17" fill="#475569">Shared inspection cache</text>
<rect x="1055" y="850" width="340" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1073" y="882" font-size="21" fill="#172a43" font-weight="600">Media Processing</text>
<text x="1073" y="915" font-size="17" fill="#475569">Execution preflight + FFmpeg</text>
<text x="1073" y="941" font-size="17" fill="#475569">Validated temporary outputs</text>
<rect x="325" y="995" width="1070" height="60" rx="12" fill="#e2eee8" stroke="#cbd5e1"/>
<text x="345" y="1020" font-size="20" fill="#172a43" font-weight="600">Resource Access</text>
<text x="565" y="1020" font-size="17" fill="#475569">Shared source identities · Root confinement · Source revalidation</text>
<text x="345" y="1043" font-size="16" fill="#475569">Used by Library, Playback, Selection, Preparation, Planning, Inspection, Processing and Subtitles.</text>
<path d="M860 1075 V1130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="882" y="1107" font-size="17" fill="#475569">uses mechanisms</text>
<rect x="300" y="1130" width="1120" height="115" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="325" y="1164" font-size="23" fill="#172a43" font-weight="600">Platform adapters</text>
<text x="325" y="1195" font-size="17" fill="#475569">Filesystem · Persistence mechanisms · Media tools / processes · Environment · Logging</text>
<text x="325" y="1222" font-size="17" fill="#475569">Mechanisms only; business workflows and asset lifetimes stay with their module owners.</text>
<rect x="40" y="310" width="220" height="935" rx="12" fill="#f5f3ff" stroke="#cbd5e1"/>
<text x="60" y="348" font-size="24" fill="#172a43" font-weight="600">Bootstrap</text>
<text x="60" y="399" font-size="17" fill="#475569">Constructs modules</text>
<text x="60" y="433" font-size="17" fill="#475569">Injects dependencies</text>
<text x="60" y="467" font-size="17" fill="#475569">Connects ports</text>
<text x="60" y="501" font-size="17" fill="#475569">Manages startup</text>
<text x="60" y="535" font-size="17" fill="#475569">Orders shutdown</text>
<text x="60" y="695" font-size="17" fill="#172a43" font-weight="600">Assembly boundary</text>
<text x="60" y="730" font-size="16" fill="#475569">May import module</text>
<text x="60" y="756" font-size="16" fill="#475569">implementations.</text>
<text x="60" y="821" font-size="16" fill="#475569">Business modules</text>
<text x="60" y="847" font-size="16" fill="#475569">do not depend on</text>
<text x="60" y="873" font-size="16" fill="#475569">Bootstrap.</text>
<path d="M260 355 H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M260 485 H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M260 1185 H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
