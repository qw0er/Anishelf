<rect x="300" y="1315" width="340" height="90" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="318" y="1347" font-size="21" fill="#172a43" font-weight="600">SQLite</text>
<text x="318" y="1379" font-size="15" fill="#475569">Durable application state</text>
<rect x="690" y="1315" width="340" height="90" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="708" y="1347" font-size="21" fill="#172a43" font-weight="600">Filesystem</text>
<text x="708" y="1379" font-size="15" fill="#475569">Read-only originals + generated assets</text>
<rect x="1080" y="1315" width="340" height="90" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="1098" y="1347" font-size="21" fill="#172a43" font-weight="600">FFprobe / FFmpeg</text>
<text x="1098" y="1379" font-size="15" fill="#475569">Inspection + bounded processing</text>
<path d="M860 1295 H470 V1315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860 1295 H1250 V1315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1450" font-size="21" fill="#172a43" font-weight="600">Key collaboration</text>
<text x="40" y="1482" font-size="17" fill="#475569">Selection → Planning + read-only prepared-copy port; Preparation → Planning + Processing; Subtitles → Inspection.</text>
<text x="40" y="1513" font-size="16" fill="#64748b">Solid arrows: layer calls / mechanism use. Dashed arrows: assembly. Selected relationships are described, not exhaustively drawn.</text>
<text x="40" y="1543" font-size="16" fill="#64748b">Future anime identification, external metadata and HLS delivery are outside this implemented-module view.</text>
</g></svg>
