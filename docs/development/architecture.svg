<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">Anishelf system architecture</title>
<desc id="desc">Browser connects through an optional TLS proxy to Caddy Web, which serves React and proxies API traffic to one private Node backend. Six modules own System, Resources, Media, Playback, Anime and Acquisition. They use SQLite, confined media storage, FFmpeg and external services through their owning adapters. Backend reads original media; qBittorrent writes downloads.</desc>
