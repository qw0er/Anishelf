# Copy to <dataDir>/transcode-profiles.yaml, then restart Backend.
# Only v2 is accepted. Invalid custom files fall back to built-ins at startup.
# See ../guide/transcode-profiles.md for scopes, validation and v1 migration.
version: 2
profiles:
  - id: custom:hevc-quality
    name: HEVC Quality
    description: High-quality 10-bit HEVC copy with stereo audio.
    container: mp4
    # Defaults to false: disable compatibility copying. Matching targets still copy.
    # User filters always require encoding.
    copyCompatibleStreams: false
    # Optional globalOptions / inputOptions use the same scalar mapping as options.
    video:
      encoder: libx265
      # Omit codec only when the running FFmpeg inventory can infer it.
      codec: hevc
      pixelFormat: yuv420p10le
      maxHeight: 1080
      # All options (including profile/level) apply only when encoding.
      options:
        preset: slow
        crf: 20
        tune: animation
        x265-params: "aq-mode=3:psy-rd=2.0"
      filters:
        - "hqdn3d=1.5:1.5:6:6"
    audio:
      encoder: aac
      codec: aac
      channels: 2
      sampleRate: 48000
      options:
        b: 192k
      # Optional filters run on each retained audio track.
    muxerOptions:
      movflags: "+faststart"
