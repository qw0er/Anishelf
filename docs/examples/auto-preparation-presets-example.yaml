# Optional: copy to <dataDir>/auto-preparation-presets.yaml and use Reload profiles in Settings.
# Missing files use built-ins. Invalid custom files expose a configuration issue
# and fall back to built-ins; a missing saved preset pauses automatic preparation.
# Enable and select a preset in Settings; this file contains no runtime switch.
version: 1
presets:
  - id: custom:web
    name: Custom Web
    description: Accept H.264 and VP9 SDR video while preserving audio formats.
    match:
      # Empty/omitted lists accept all roots, paths and file viewing states.
      rootIds: []
      include: []
      exclude: ["**/Extras/**"]
      viewingStates: [unwatched, in-progress]
    audio:
      # all (default) | default | languages | none
      selection: all
      # languages: [jpn, eng] # Required for selection: languages.
      # fallback: default   # default | all | skip, when no language matches.
    accept:
      containers: [mp4, webm]
      # Candidates are OR; fields within one candidate are AND.
      video:
        - codecs: [h264, vp9]
          pixelFormats: [yuv420p]
          dynamicRanges: [sdr]
      # Empty/omitted audio accepts all audio formats, subject to muxing limits.
      audio: []
    transcodeProfileId: builtin:balanced

# Optional video constraints within each candidate:
#   codecs, pixelFormats, profiles, maxLevel, maxWidth, maxHeight,
#   maxFrameRate, maxBitrateKbps, dynamicRanges (sdr | hdr10 | hlg).
# Optional audio constraints within each candidate:
#   codecs, profiles, maxChannels, sampleRates (Hz), maxBitrateKbps.
# Lists [] and omitted constraints are unrestricted; scalar null is unrestricted.
# Nonempty profiles or maxLevel require exactly one codec in the candidate.
# Profile/level names are normalized and interpreted for that codec.
# Output settings must meet acceptance; no acceptance field overrides encoding.
