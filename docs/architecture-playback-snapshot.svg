<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
<title id="title">Anishelf runtime ownership</title>
<desc id="desc">Browser evidence feeds read-only playback selection. Progress sessions are independent. Preparation commands own tasks and artifacts. Bootstrap injects explicit ports; shared platform mechanisms sit below business owners. HLS delivery remains planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="1600" height="1340" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172a43">
<text x="40" y="48" font-size="30" font-weight="600">Anishelf · Runtime ownership</text>
<text x="40" y="82" font-size="18">Explicit ports · Bootstrap injection · Original source timeline · No automatic preparation</text>
<rect x="40" y="112" width="470" height="168" rx="12" fill="#f5f9ff" stroke="#b3c2d3"/>
<text x="60" y="146" font-size="21" font-weight="600">Web / Library + preparation</text>
<text x="60" y="180" font-size="17">Shared QueryClient / loaders + observers</text>
<text x="60" y="208" font-size="17">Explicit create / cancel / retry / delete</text>
<text x="60" y="236" font-size="17">Batched summaries / on-demand file tasks</text>
<rect x="560" y="112" width="480" height="168" rx="12" fill="#f5f9ff" stroke="#b3c2d3"/>
<text x="580" y="146" font-size="21" font-weight="600">Web / Playback</text>
<text x="580" y="180" font-size="17">Controller collects evidence / stable resource</text>
<text x="580" y="208" font-size="17">Vidstack uses the returned resource only</text>
<text x="580" y="236" font-size="17">Independent serial progress controller</text>
<rect x="1090" y="112" width="470" height="168" rx="12" fill="#f5f9ff" stroke="#b3c2d3"/>
<text x="1110" y="146" font-size="21" font-weight="600">Web / Subtitles</text>
<text x="1110" y="180" font-size="17">Track discovery and selected preparation</text>
<text x="1110" y="208" font-size="17">Vidstack / JASSUB render text tracks</text>
<text x="1110" y="236" font-size="17">Source-timeline timing and asset cleanup</text>
<rect x="40" y="350" width="470" height="190" rx="12" fill="#f8f7fc" stroke="#b3c2d3"/>
<text x="60" y="384" font-size="21" font-weight="600">Library + Configuration</text>
<text x="60" y="418" font-size="17">Published index, scans and root switching</text>
<text x="60" y="446" font-size="17">Atomic settings and immutable policy</text>
<text x="60" y="474" font-size="17">Configured transcode profile catalog</text>
<rect x="560" y="350" width="480" height="190" rx="12" fill="#f8f7fc" stroke="#b3c2d3"/>
<text x="580" y="384" font-size="21" font-weight="600">Playback Selection</text>
<text x="580" y="418" font-size="17">POST /playback/options → candidates</text>
<text x="580" y="446" font-size="17">POST /playback/selection → final resource</text>
<text x="580" y="474" font-size="17">Exact audio, browser evidence, availability</text>
<text x="580" y="502" font-size="17">Read ports only; never starts preparation</text>
<rect x="1090" y="350" width="470" height="190" rx="12" fill="#f8f7fc" stroke="#b3c2d3"/>
<text x="1110" y="384" font-size="21" font-weight="600">Playback records</text>
<text x="1110" y="418" font-size="17">Progress-write tokens + generations</text>
<text x="1110" y="446" font-size="17">Durable progress and recent history</text>
<text x="1110" y="474" font-size="17">No playback plan in session responses</text>
<text x="1110" y="502" font-size="17">Resource switches retain the writer</text>
<path d="M275 280 V350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="287" y="319" font-size="15" fill="#64748b">HTTP</text>
<path d="M800 280 V350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="810" y="319" font-size="15" fill="#64748b">HTTP / capability evidence</text>
<path d="M1000 280 V315 H1325 V350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1200" y="304" font-size="15" fill="#64748b">HTTP / progress</text>
<rect x="40" y="620" width="470" height="200" rx="12" fill="#eef7f3" stroke="#b3c2d3"/>
<text x="60" y="654" font-size="21" font-weight="600">Preparation</text>
<text x="60" y="688" font-size="17">Command facade → scheduler → worker</text>
<text x="60" y="716" font-size="17">Artifact validation, publication and borrowing</text>
<text x="60" y="744" font-size="17">Recovery and file / database reconciliation</text>
<text x="60" y="772" font-size="17">Temporary execution is not a ready artifact</text>
<rect x="560" y="620" width="480" height="200" rx="12" fill="#eef7f3" stroke="#b3c2d3"/>
<text x="580" y="654" font-size="21" font-weight="600">Media Planning + Inspection</text>
<text x="580" y="688" font-size="17">Inspection cache and source descriptions</text>
<text x="580" y="716" font-size="17">Evidence checks and pure execution plans</text>
<text x="580" y="744" font-size="17">One expected output specification</text>
<text x="580" y="772" font-size="17">File / media-source execution decisions</text>
<rect x="1090" y="620" width="470" height="200" rx="12" fill="#eef7f3" stroke="#b3c2d3"/>
<text x="1110" y="654" font-size="21" font-weight="600">Subtitles</text>
<text x="1110" y="688" font-size="17">Discovery → selected-track preparation</text>
<text x="1110" y="716" font-size="17">Registered text assets and confined delivery</text>
<text x="1110" y="744" font-size="17">External text / embedded extraction</text>
<text x="1110" y="772" font-size="17">Recovery and lifecycle ownership</text>
<path d="M650 540 V578 H275 V620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="570" font-size="15" fill="#64748b">validated copies</text>
<path d="M800 540 V620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="810" y="578" font-size="15" fill="#64748b">inspection / evidence validation</text>
<path d="M1450 280 V620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1460" y="600" font-size="15" fill="#64748b">HTTP</text>
<rect x="40" y="900" width="470" height="170" rx="12" fill="#f8fafc" stroke="#b3c2d3"/>
<text x="60" y="934" font-size="21" font-weight="600">Media Processing</text>
<text x="60" y="968" font-size="17">Preflight and FFmpeg execution</text>
<text x="60" y="996" font-size="17">Internal telemetry and output validation</text>
<text x="60" y="1024" font-size="17">Validated temporary output + release</text>
<rect x="560" y="900" width="480" height="170" rx="12" fill="#f8fafc" stroke="#b3c2d3"/>
<text x="580" y="934" font-size="21" font-weight="600">Resource Access</text>
<text x="580" y="968" font-size="17">Canonical root, source version and epoch</text>
<text x="580" y="996" font-size="17">Confined opening and source revalidation</text>
<text x="580" y="1024" font-size="17">Shared source registry; originals read-only</text>
<rect x="1090" y="900" width="470" height="170" rx="12" fill="#f8fafc" stroke="#b3c2d3"/>
<text x="1110" y="934" font-size="21" font-weight="600">Bootstrap + Platform</text>
<text x="1110" y="968" font-size="17">Explicit construction and shutdown order</text>
<text x="1110" y="996" font-size="17">SQLite / filesystem / process mechanisms</text>
<text x="1110" y="1024" font-size="17">Transport projects DTOs, errors and URLs</text>
<path d="M275 820 V900" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="867" font-size="15" fill="#64748b">execute</text>
<path d="M800 820 V900" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="810" y="866" font-size="15" fill="#64748b">source capability</text>
<text x="40" y="1120" font-size="18">Selection, progress, preparation, planning and subtitles consume explicit source capabilities; only bootstrap assembles implementations.</text>
<rect x="40" y="1160" width="1520" height="130" rx="12" fill="#fff8eb" stroke="#b3c2d3" stroke-dasharray="8 6"/>
<text x="60" y="1194" font-size="21" font-weight="600">Planned delivery work</text>
<text x="60" y="1228" font-size="17">HLS publication / browser delivery, real-time acquisition and leases, embedded fonts, automatic cache eviction.</text>
<text x="60" y="1256" font-size="17">Offline per-track HLS planning is independently tested; no runtime ports or HTTP delivery contracts.</text>
</g></svg>
