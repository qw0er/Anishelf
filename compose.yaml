# Development stack: build from the current checkout.
# For published images, use package/deploy/compose.yaml or the README example.
services:
  backend:
    image: localhost/anishelf-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: package/Dockerfile
      target: backend
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      ANISHELF_PUBLIC_ORIGIN: ${ANISHELF_PUBLIC_ORIGIN:-}
      ANISHELF_ALLOWED_HOSTS: ${ANISHELF_ALLOWED_HOSTS:-}
      # Trust only proxies on this private container network; keep Backend unpublished.
      ANISHELF_TRUSTED_PROXIES: ${ANISHELF_TRUSTED_PROXIES:-loopback,uniquelocal}
      ANISHELF_DATA_DIR: /data/app
      ANISHELF_INITIAL_RESOURCE_ROOTS: /data/media
      ANISHELF_QBITTORRENT_API_URL: http://qbittorrent:8080
      ANISHELF_BUNDLED_QBITTORRENT_CONNECTION_FILE: /run/anishelf-qbittorrent/connection.json
      ANISHELF_BUNDLED_JACKETT_CONFIG_FILE: /run/jackett-config/Jackett/ServerConfig.json
    volumes:
      - anishelf-app:/data/app
      - qbittorrent-connection:/run/anishelf-qbittorrent:ro
      - jackett-config:/run/jackett-config:ro
      - ${ANISHELF_MEDIA_PATH:-anishelf-media}:/data/media:rw
    # Keep the Backend readiness dependency explicit in this deployment.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    image: localhost/anishelf-web:dev
    pull_policy: build
    build:
      context: .
      dockerfile: package/Dockerfile
      target: web
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      ANISHELF_PUBLIC_ORIGIN: ${ANISHELF_PUBLIC_ORIGIN:-}
      ANISHELF_WEB_TRUSTED_PROXIES: ${ANISHELF_WEB_TRUSTED_PROXIES:-127.0.0.1/32 ::1/128}
    ports:
      - "${ANISHELF_BIND_ADDRESS:-127.0.0.1}:${ANISHELF_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

  qbittorrent-init:
    profiles: [qbittorrent]
    image: localhost/anishelf-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: package/Dockerfile
      target: backend
    user: "0:0"
    restart: "no"
    command: ["node", "/app/package/qbittorrent-init.mjs"]
    healthcheck:
      disable: true
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-connection:/connection

  qbittorrent:
    depends_on:
      qbittorrent-init:
        condition: service_completed_successfully
    profiles: [qbittorrent]
    # Initialize only the mount roots before LinuxServer's normal init process.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/media /data/incomplete
        chown "$${PUID}:$${PGID}" /data/media /data/incomplete
        echo "qBittorrent media and incomplete mount roots initialized."
        exec /init
    image: linuxserver/qbittorrent:${QBITTORRENT_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "${QBITTORRENT_PEER_PORT:-6881}"
    ports:
      - "${QBITTORRENT_BIND_ADDRESS:-127.0.0.1}:${QBITTORRENT_WEBUI_PORT:-8080}:8080"
      - "${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}"
      - "${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}/udp"
    volumes:
      - qbittorrent-config:/config
      - ${ANISHELF_MEDIA_PATH:-anishelf-media}:/data/media
      - qbittorrent-incomplete:/data/incomplete

  jackett-init:
    profiles: [jackett]
    image: localhost/anishelf-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: package/Dockerfile
      target: backend
    user: "0:0"
    restart: "no"
    command: ["node", "/app/package/jackett-init.mjs"]
    healthcheck:
      disable: true
    volumes:
      - jackett-config:/config

  jackett:
    depends_on:
      jackett-init:
        condition: service_completed_successfully
    profiles: [jackett]
    image: ghcr.io/linuxserver/jackett:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "1000"
      PGID: "1000"
      AUTO_UPDATE: "false"
      UMASK: "077"
    ports:
      - "${JACKETT_BIND_ADDRESS:-127.0.0.1}:${JACKETT_PORT:-9117}:9117"
    volumes:
      - jackett-config:/config

volumes:
  anishelf-app:
    name: anishelf-app
  anishelf-media:
    name: anishelf-media
  qbittorrent-incomplete:
    name: anishelf-qbittorrent-incomplete
  qbittorrent-connection:
    name: anishelf-qbittorrent-connection
  qbittorrent-config:
    name: anishelf-qbittorrent-config
  jackett-config:
    name: anishelf-jackett-config
