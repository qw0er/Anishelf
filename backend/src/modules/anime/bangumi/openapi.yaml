# Subset of https://github.com/bangumi/api/blob/master/open-api/v0.yaml
# Retrieved 2026-10-25.
openapi: 3.0.2
info:
  title: Bangumi metadata subset
  version: 2026-10-25
paths:
  /v0/search/subjects:
    post:
      tags:
        - 条目
      summary: 条目搜索
      operationId: searchSubjects
      description: |
        ## 实验性 API， 本 schema 和实际的 API 行为都可能随时发生改动

        目前支持的筛选条件包括:
        - `type`: 条目类型，参照 `SubjectType` enum， `或`。
        - `tag`: 标签，可以多次出现。`且` 关系。
        - `air_date`: 播出日期/发售日期。`且` 关系。
        - `rating`: 用于搜索指定评分的条目。`且` 关系。
        - `rating_count`: 用于按照评分人数筛选条目。`且` 关系。
        - `rank`: 用于搜索指定排名的条目。`且` 关系。
        - `nsfw`: 使用 `include` 包含NSFW搜索结果。默认排除搜索NSFW条目。无权限情况下忽略此选项，不会返回NSFW条目。

        不同筛选条件之间为 `且`
      parameters:
        - name: limit
          in: query
          description: 分页参数
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          description: 分页参数
          required: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - keyword
              properties:
                keyword:
                  type: string
                sort:
                  enum:
                    - match
                    - heat
                    - rank
                    - score
                  default: match
                  type: string
                  example: rank
                  description: |
                    排序规则

                    - `match` meilisearch 的默认排序，按照匹配程度
                    - `heat` 收藏人数
                    - `rank` 排名由高到低
                    - `score` 评分
                filter:
                  type: object
                  description: 不同条件之间是 `且` 的关系
                  properties:
                    type:
                      type: array
                      items:
                        $ref: "#/components/schemas/SubjectType"
                      description: 条目类型，参照 `SubjectType` enum，多值之间为 `或` 的关系。
                    meta_tags:
                      type: array
                      items:
                        type: string
                      example:
                        - 童年
                        - 原创
                      description: 公共标签。多个值之间为 `且` 关系。可以用 `-` 排除标签。比如 `-科幻` 可以排除科幻标签。
                    tag:
                      type: array
                      items:
                        type: string
                      example:
                        - 童年
                        - 原创
                      description: 标签，可以多次出现。多值之间为 `且` 关系。
                    air_date:
                      type: array
                      items:
                        type: string
                      example:
                        - ">=2020-07-01"
                        - <2020-10-01
                      description: 播出日期/发售日期，日期必需为 `YYYY-MM-DD` 格式。多值之间为 `且` 关系。
                    rating:
                      type: array
                      items:
                        type: string
                      example:
                        - ">=6"
                        - <8
                      description: 用于搜索指定评分的条目，多值之间为 `且` 关系。
                    rating_count:
                      type: array
                      items:
                        type: string
                      example:
                        - ">=200"
                        - <5000
                      description: 用于按照评分人数筛选条目，多值之间为 `且` 关系，格式与 `rating` 相同。
                    rank:
                      type: array
                      items:
                        type: string
                      example:
                        - ">10"
                        - <=18
                      description: 用于搜索指定排名的条目，多值之间为 `且` 关系。
                    nsfw:
                      type: boolean
                      description: |
                        无权限的用户会直接忽略此字段，不会返回R18条目。

                        默认或者 `null` 会返回包含 R18 的所有搜索结果。

                        `true` 只会返回 R18 条目。

                        `false` 只会返回非 R18 条目。
      responses:
        "200":
          description: 返回搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paged_Subject"
  /v0/subjects/{subject_id}:
    get:
      tags:
        - 条目
      summary: 获取条目
      description: cache with 300s
      operationId: getSubjectById
      parameters:
        - $ref: "#/components/parameters/path_subject_id"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
      security:
        - OptionalHTTPBearer: []
components:
  schemas:
    SubjectType:
      title: SubjectType
      example: 2
      enum:
        - 1
        - 2
        - 3
        - 4
        - 6
      type: integer
      description: |-
        条目类型
        - `1` 为 书籍
        - `2` 为 动画
        - `3` 为 音乐
        - `4` 为 游戏
        - `6` 为 三次元

        没有 `5`
      x-ms-enum:
        name: SubjectType
        modelAsString: false
        values:
          - Book
          - Anime
          - Music
          - Game
          - Real
      x-enum-varnames:
        - Book
        - Anime
        - Music
        - Game
        - Real
    Paged_Subject:
      title: Paged[Subject]
      type: object
      properties:
        total:
          title: Total
          type: integer
          default: 0
        limit:
          title: Limit
          type: integer
          default: 0
        offset:
          title: Offset
          type: integer
          default: 0
        data:
          title: Data
          type: array
          items:
            $ref: "#/components/schemas/Subject"
          default: []
    Subject:
      title: Subject
      required:
        - id
        - type
        - name
        - name_cn
        - summary
        - nsfw
        - locked
        - platform
        - meta_tags
        - volumes
        - eps
        - series
        - total_episodes
        - rating
        - images
        - collection
        - tags
      type: object
      properties:
        id:
          title: ID
          type: integer
        type:
          title: Type
          type: integer
          allOf:
            - $ref: "#/components/schemas/SubjectType"
        name:
          title: Name
          type: string
        name_cn:
          title: Name Cn
          type: string
        summary:
          title: Summary
          type: string
        series:
          title: Series
          type: boolean
          description: 是否为书籍系列的主条目
        nsfw:
          title: Nsfw
          type: boolean
        locked:
          title: Locked
          type: boolean
        date:
          title: Date
          type: string
          description: air date in `YYYY-MM-DD` format
        platform:
          title: Platform
          type: string
          description: TV, Web, 欧美剧, DLC...
        images:
          $ref: "#/components/schemas/Images"
        infobox:
          $ref: "#/components/schemas/WikiV0"
        volumes:
          title: Volumes
          type: integer
          description: 书籍条目的册数，由旧服务端从wiki中解析
        eps:
          title: Eps
          type: integer
          description: 由旧服务端从wiki中解析，对于书籍条目为`话数`
        total_episodes:
          title: Total Episodes
          type: integer
          description: 数据库中的章节数量
        rating:
          title: Rating
          required:
            - rank
            - total
            - count
            - score
          type: object
          properties:
            rank:
              title: Rank
              type: integer
            total:
              title: Total
              type: integer
            count:
              title: Count
              type: object
              properties:
                "1":
                  type: integer
                "2":
                  type: integer
                "3":
                  type: integer
                "4":
                  type: integer
                "5":
                  type: integer
                "6":
                  type: integer
                "7":
                  type: integer
                "8":
                  type: integer
                "9":
                  type: integer
                "10":
                  type: integer
            score:
              title: Score
              type: number
        collection:
          title: Collection
          required:
            - wish
            - collect
            - doing
            - on_hold
            - dropped
          type: object
          properties:
            wish:
              title: Wish
              type: integer
            collect:
              title: Collect
              type: integer
            doing:
              title: Doing
              type: integer
            on_hold:
              title: On Hold
              type: integer
            dropped:
              title: Dropped
              type: integer
        meta_tags:
          description: 由维基人维护的 tag
          type: array
          items:
            type: string
        tags:
          $ref: "#/components/schemas/SubjectTags"
    Images:
      title: Images
      required:
        - large
        - common
        - medium
        - small
        - grid
      type: object
      properties:
        large:
          title: Large
          type: string
        common:
          title: Common
          type: string
        medium:
          title: Medium
          type: string
        small:
          title: Small
          type: string
        grid:
          title: Grid
          type: string
    WikiV0:
      title: Infobox
      type: array
      items:
        title: Item
        required:
          - key
          - value
        type: object
        properties:
          key:
            title: Key
            type: string
          value:
            title: Value
            type: object
            anyOf:
              - type: string
              - type: array
                items:
                  anyOf:
                    - title: KV
                      required:
                        - k
                        - v
                      type: object
                      properties:
                        k:
                          title: K
                          type: string
                        v:
                          title: V
                          type: string
                    - title: V
                      required:
                        - v
                      type: object
                      properties:
                        v:
                          title: V
                          type: string
      example:
        - key: 简体中文名
          value: 鲁路修·兰佩路基
        - key: 别名
          value:
            - v: L.L.
            - v: 勒鲁什
            - v: 鲁鲁修
            - v: ゼロ
            - v: Zero
            - k: 英文名
              v: Lelouch Lamperouge
            - k: 第二中文名
              v: 鲁路修·冯·布里塔尼亚
            - k: 英文名二
              v: Lelouch Vie Britannia
            - k: 日文名
              v: ルルーシュ・ヴィ・ブリタニア
        - key: 性别
          value: 男
        - key: 生日
          value: 12月5日
        - key: 血型
          value: A型
        - key: 身高
          value: 178cm→181cm
        - key: 体重
          value: 54kg
        - key: 引用来源
          value: Wikipedia
    SubjectTags:
      title: Tags
      type: array
      items:
        title: Tag
        required:
          - name
          - count
          - total_count
        type: object
        properties:
          name:
            title: Name
            type: string
          count:
            title: Count
            description: 使用此标签标记本条目的用户数
            type: integer
          total_count:
            title: Total Count
            description: 此标签在所有条目中的使用总次数
            type: integer
    SubjectID:
      title: Subject ID
      minimum: 1
      description: 条目 ID
      type: integer
    ErrorDetail:
      title: ErrorDetail
      required:
        - title
        - description
      type: object
      properties:
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        details:
          title: Detail
          oneOf:
            - type: string
            - type: object
              properties:
                error:
                  type: string
                  description: error message
                path:
                  type: string
                  description: request path
  parameters:
    path_subject_id:
      required: true
      name: subject_id
      description: 条目 ID
      schema:
        $ref: "#/components/schemas/SubjectID"
      in: path
