# Set ANISHELF_CONFIG to the absolute path of your deployment TOML.
# host defaults to 127.0.0.1; only loopback IP addresses are supported in V1.
host = "127.0.0.1"
port = 8801
# Required; created at startup if missing.
dataDir = "/absolute/path/to/anishelf-data"

[logging]
level = "info"
destination = "stdout"
# For file output, use destination = "file" and an absolute path:
# path = "/absolute/path/to/logs/anishelf.log"
